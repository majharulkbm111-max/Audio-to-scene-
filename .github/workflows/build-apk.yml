name: Build APK
on:
  workflow_dispatch:
    inputs:
      with_biometric:
        description: 'আঙুলের ছাপ প্লাগইন যোগ করবেন? (বিল্ড ব্যর্থ হলে false দিন)'
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          if [ "${{ inputs.with_biometric }}" = "true" ]; then
            npm i @aparajita/capacitor-biometric-auth --legacy-peer-deps
          fi
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.amarhisab.app",
            "appName": "আমার হিসাব",
            "webDir": "www",
            "backgroundColor": "#0b5137"
          }
          EOF
          npx cap add android
          npx cap sync android
      - name: Android tweaks
        run: |
          cat > android/app/src/main/res/values/amar_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="amarBg">#0B5137</color>
          </resources>
          EOF
          python3 - <<'EOF'
          import re
          p = 'android/app/src/main/res/values/styles.xml'
          s = open(p, encoding='utf-8').read()
          m = re.search(r'<style\s+name="AppTheme\.NoActionBar"[^>]*>', s)
          if m:
              s = s[:m.end()] + '\n        <item name="android:windowBackground">@color/amarBg</item>' + s[m.end():]
          open(p, 'w', encoding='utf-8').write(s)
          mp = 'android/app/src/main/AndroidManifest.xml'
          t = open(mp, encoding='utf-8').read()
          if 'android.permission.CAMERA' not in t:
              t = t.replace('<application', '<uses-permission android:name="android.permission.CAMERA" />\n    <application', 1)
          open(mp, 'w', encoding='utf-8').write(t)
          EOF
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk amar-hisab.apk
          gh release create "v${{ github.run_number }}" amar-hisab.apk --title "আমার হিসাব v${{ github.run_number }}" --notes "Auto build"
